<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gab'1</title>
  <meta name="description" content="profite de la sueur">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050505;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --fg: #ffffff;
      --muted: #a3a3a3;
      --accent-glow: rgba(255, 255, 255, 0.15);
      --shadow-deep: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: Montserrat, system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 40%),
        var(--bg);
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 60px 16px 80px;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 48px;
      text-align: center;
    }

    .pdp {
      width: 130px;
      height: 130px;
      border-radius: 999px;
      object-fit: cover;
      display: block;
      border: 1px solid var(--card-border);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1), var(--shadow-deep);
    }

    .subtext {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .page-title {
      margin: 40px 0 24px;
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    /* GLASSMORPHISM CARD */
    .card {
      grid-column: span 12;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow-deep);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 15px var(--accent-glow);
    }

    .card a {
      display: flex;
      align-items: center;
      color: #fff;
      text-decoration: none;
      width: 100%;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .plat-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .card:hover .plat-logo {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.12);
    }

    .plat-logo img,
    .plat-logo svg {
      width: 26px;
      height: 26px;
      object-fit: contain;
      display: block;
    }

    .label {
      margin: 0;
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 0.5px;
    }

    .desc {
      margin: 4px 0 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    @media(min-width: 720px) {
      .card--half { grid-column: span 6; }
      .card--wide { grid-column: span 12; }
    }
  </style>

</head>
